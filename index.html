<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pathfinder Dispatch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Pathfinder Dispatch</h1>
    <p class="tagline">Pick the right search algorithm. Watch it work. See what it cost.</p>
  </header>

  <main>
    <section class="board">
      <div class="level-header">
        <span id="level-title">Level 1</span>
        <span id="level-progress"></span>
      </div>
      <p id="level-brief" class="brief"></p>

      <canvas id="map" width="600" height="600"></canvas>

      <div class="legend">
        <span><i class="sw grass"></i> grass (cost 1)</span>
        <span><i class="sw swamp"></i> swamp (cost 5)</span>
        <span><i class="sw wall"></i> wall</span>
        <span><i class="sw visited"></i> explored</span>
        <span><i class="sw frontier"></i> frontier</span>
        <span><i class="sw path"></i> path</span>
      </div>
    </section>

    <aside class="panel">
      <h2>Objective</h2>
      <p id="objective"></p>

      <h2>Budgets</h2>
      <div class="budget">
        <label>Expansions <span id="exp-count">0</span> / <span id="exp-limit">-</span></label>
        <div class="bar"><div id="exp-bar" class="fill"></div></div>
      </div>
      <div class="budget">
        <label>Frontier peak <span id="front-count">0</span> / <span id="front-limit">-</span></label>
        <div class="bar"><div id="front-bar" class="fill"></div></div>
      </div>

      <h2>Choose an algorithm</h2>
      <div class="algos">
        <button class="algo" data-algo="bfs">BFS<small>queue</small></button>
        <button class="algo" data-algo="dfs">DFS<small>stack</small></button>
        <button class="algo" data-algo="dijkstra">Dijkstra<small>by cost</small></button>
        <button class="algo" data-algo="astar">A*<small>cost + guess</small></button>
      </div>

      <div class="controls">
        <button id="btn-step" disabled>Step</button>
        <button id="btn-play" disabled>Play</button>
        <label>Speed <input id="speed" type="range" min="1" max="30" value="8" /></label>
      </div>

      <div id="verdict" class="verdict hidden">
        <div id="stars" class="stars"></div>
        <p id="verdict-text"></p>
        <p id="verdict-why" class="why"></p>
      </div>

      <div id="compare" class="compare hidden">
        <h2>How the others would have done</h2>
        <div id="compare-grid" class="compare-grid"></div>
      </div>

      <div class="nav">
        <button id="btn-retry" disabled>Retry</button>
        <button id="btn-next" disabled>Next level</button>
      </div>
    </aside>
  </main>

  <script src="levels.js"></script>
  <script src="search.js"></script>
  <script src="render.js"></script>
  <script src="game.js"></script>
</body>
</html>
